schema_version: 1
ocr:
  endpoint: http://127.0.0.1:8766
  device: cpu
  token_env: LETSAIGC_VISION_TOKEN
  signing_key_env: LETSAIGC_VISION_SIGNING_KEY
  artifact_root: .local/pipelines/artifacts
  job_root: .local/vision/ocr/jobs
  cache_root: .local/cache/paddlex
  lock: configs/runtime/vision.lock.yaml
  platform_locks:
    Darwin-arm64: configs/runtime/vision.macos-arm64.lock.yaml
  maximum_active_jobs: 1
segmentation:
  endpoint: http://127.0.0.1:8767
  device: cuda
  token_env: LETSAIGC_VISION_TOKEN
  signing_key_env: LETSAIGC_VISION_SIGNING_KEY
  artifact_root: .local/pipelines/artifacts
  job_root: .local/vision/segmentation/jobs
  lock: configs/runtime/vision.lock.yaml
  platform_locks:
    Windows-AMD64: configs/runtime/vision-sam2.windows-amd64.lock.yaml
  maximum_active_jobs: 1
  model_view_edge: 1024
  model_view_pad_to: 1
