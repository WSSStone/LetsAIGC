schema_version: 1
id: sdxl-lora-low-vram
base_model: sdxl-base-1.0
dataset_dir: .local/datasets/sdxl-lora
output_dir: .local/training/sdxl-lora
output_name: sdxl-rank8
caption_extension: .txt
resolution: 768
enable_bucket: true
min_bucket_reso: 256
max_bucket_reso: 1024
max_train_steps: 1200
train_batch_size: 1
network_module: networks.lora
network_dim: 8
network_alpha: 8
learning_rate: 0.0001
unet_lr: 0.0001
train_text_encoder: false
mixed_precision: fp16
save_precision: fp16
optimizer_type: AdamW8bit
gradient_checkpointing: true
sdpa: true
cache_latents: true
cache_latents_to_disk: true
cache_text_encoder_outputs: true
cache_text_encoder_outputs_to_disk: true
no_half_vae: true
seed: 20260831
save_model_as: safetensors
max_data_loader_n_workers: 0
resource_budget: {vram_gib: 10, ram_gib: 56, free_disk_gib: 40, timeout_minutes: 720}
