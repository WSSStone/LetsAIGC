schema_version: 1
id: sdxl-t2i
version: 1.0.0
intent: text_to_image
stability: stable
base_workflow: workflows/api/sdxl-smoke.json
models: [sdxl-base-1.0]
allowed_nodes: [CheckpointLoaderSimple, EmptyLatentImage, CLIPTextEncode, KSampler, VAEDecode, SaveImage]
parameter_bounds:
  prompt: {node: "6", input: text, type: string, min_length: 1, max_length: 2000}
  negative_prompt: {node: "7", input: text, type: string, max_length: 2000}
  seed: {node: "3", input: seed, type: integer, minimum: 0}
  width: {node: "5", input: width, type: integer, minimum: 512, maximum: 1536, multiple_of: 64}
  height: {node: "5", input: height, type: integer, minimum: 512, maximum: 1536, multiple_of: 64}
  steps: {node: "3", input: steps, type: integer, minimum: 1, maximum: 60}
  cfg: {node: "3", input: cfg, type: number, minimum: 1, maximum: 20}
mutable_parameters: [prompt, negative_prompt, seed, steps, cfg]
outputs: [{node_id: "9", history_field: images, role: primary_image, media_kind: image, allowed_extensions: [.png]}]
resource_budget: {vram_gib: 10, ram_gib: 24, free_disk_gib: 8, timeout_seconds: 600}
