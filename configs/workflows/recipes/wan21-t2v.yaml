  seed: {node: "7", input: seed, type: integer, minimum: 0}
  width: {node: "6", input: width, type: integer, minimum: 256, maximum: 512, multiple_of: 16}
  height: {node: "6", input: height, type: integer, minimum: 256, maximum: 512, multiple_of: 16}
  frames: {node: "6", input: length, type: integer, minimum: 1, maximum: 17}
  fps: {node: "9", input: fps, type: number, minimum: 1, maximum: 16}
  steps: {node: "7", input: steps, type: integer, minimum: 1, maximum: 40}
mutable_parameters: [prompt, negative_prompt, seed, steps]
outputs: [{node_id: "10", history_field: images, role: primary_video, media_kind: video, allowed_extensions: [.mp4]}]
resource_budget: {vram_gib: 10, ram_gib: 32, free_disk_gib: 12, timeout_seconds: 3600}
