schema_version: 1
id: wan21-t2v
version: 1.0.0
intent: text_to_video
stability: stable
base_workflow: workflows/api/wan21-t2v-smoke.json
models: [wan21-t2v-1.3b]
allowed_nodes: [UNETLoader, CLIPLoader, VAELoader, CLIPTextEncode, EmptyHunyuanLatentVideo, KSampler, VAEDecode, CreateVideo, SaveVideo]
parameter_bounds:
