schema_version: 1
id: flux-schnell-smoke
version: 1.0.0
description: Fixed-seed FLUX.1 Schnell FP8 offload feasibility workflow
ui_workflow: workflows/ui/flux-schnell-smoke.json
api_workflow: workflows/api/flux-schnell-smoke.json
input_schema:
  type: object
  additionalProperties: false
  required: [prompt, negative_prompt, seed, width, height, steps, cfg]
  properties:
    prompt: {type: string, minLength: 1, maxLength: 2000}
    negative_prompt: {type: string, maxLength: 2000}
    seed: {type: integer, minimum: 0, maximum: 18446744073709551615}
    width: {type: integer, minimum: 512, maximum: 1024, multipleOf: 64}
    height: {type: integer, minimum: 512, maximum: 1024, multipleOf: 64}
    steps: {type: integer, minimum: 1, maximum: 8}
    cfg: {type: number, minimum: 1, maximum: 2}
output_schema: {type: array, items: {type: string}}
bindings: {prompt: /6/inputs/text, negative_prompt: /7/inputs/text, seed: /3/inputs/seed, width: /5/inputs/width, height: /5/inputs/height, steps: /3/inputs/steps, cfg: /3/inputs/cfg}
defaults: {prompt: "2D game asset", negative_prompt: "", seed: 20260831, width: 768, height: 768, steps: 4, cfg: 1.0}
models: [flux1-schnell-fp8]
nodes: [CheckpointLoaderSimple, EmptyLatentImage, CLIPTextEncode, KSampler, VAEDecode, SaveImage]
resource_budget: {vram_gib: 10, ram_gib: 40, free_disk_gib: 20, timeout_seconds: 1200}
export_lanes: [production]
media_kind: image
outputs:
  - {node_id: "9", history_field: images, role: primary_image, media_kind: image, allowed_extensions: [.png]}
temporal_budget: {width: 1024, height: 1024, temporary_disk_gib: 2}
