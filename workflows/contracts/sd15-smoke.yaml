schema_version: 1
id: sd15-smoke
version: 1.0.0
description: Fixed-seed 512px Stable Diffusion 1.5 smoke workflow
ui_workflow: workflows/ui/sd15-smoke.json
api_workflow: workflows/api/sd15-smoke.json
input_schema:
  type: object
  additionalProperties: false
  required: [prompt, negative_prompt, seed, width, height, steps, cfg]
  properties:
    prompt: {type: string, minLength: 1, maxLength: 2000}
    negative_prompt: {type: string, maxLength: 2000}
    seed: {type: integer, minimum: 0, maximum: 18446744073709551615}
    width: {type: integer, minimum: 256, maximum: 768, multipleOf: 64}
    height: {type: integer, minimum: 256, maximum: 768, multipleOf: 64}
    steps: {type: integer, minimum: 1, maximum: 50}
    cfg: {type: number, minimum: 1, maximum: 20}
output_schema: {type: array, items: {type: string}}
bindings:
  prompt: /6/inputs/text
  negative_prompt: /7/inputs/text
  seed: /3/inputs/seed
  width: /5/inputs/width
  height: /5/inputs/height
  steps: /3/inputs/steps
  cfg: /3/inputs/cfg
defaults: {prompt: "pixel art game asset", negative_prompt: "text, watermark, blurry", seed: 20260831, width: 512, height: 512, steps: 12, cfg: 7.0}
models: [sd15-fp16]
nodes: [CheckpointLoaderSimple, EmptyLatentImage, CLIPTextEncode, KSampler, VAEDecode, SaveImage]
resource_budget: {vram_gib: 6, ram_gib: 16, free_disk_gib: 5, timeout_seconds: 300}
export_lanes: [production]
media_kind: image
outputs:
  - {node_id: "9", history_field: images, role: primary_image, media_kind: image, allowed_extensions: [.png]}
temporal_budget: {width: 768, height: 768, temporary_disk_gib: 1}
