schema_version: 1
id: sdxl-smoke
version: 1.0.0
description: Fixed-seed 1024px SDXL Base 1.0 smoke workflow
ui_workflow: workflows/ui/sdxl-smoke.json
api_workflow: workflows/api/sdxl-smoke.json
input_schema:
  type: object
  additionalProperties: false
  required: [prompt, negative_prompt, seed, width, height, steps, cfg]
  properties:
    prompt: {type: string, minLength: 1, maxLength: 2000}
    negative_prompt: {type: string, maxLength: 2000}
    seed: {type: integer, minimum: 0, maximum: 18446744073709551615}
    width: {type: integer, minimum: 512, maximum: 1536, multipleOf: 64}
    height: {type: integer, minimum: 512, maximum: 1536, multipleOf: 64}
    steps: {type: integer, minimum: 1, maximum: 60}
    cfg: {type: number, minimum: 1, maximum: 20}
output_schema: {type: array, items: {type: string}}
bindings: {prompt: /6/inputs/text, negative_prompt: /7/inputs/text, seed: /3/inputs/seed, width: /5/inputs/width, height: /5/inputs/height, steps: /3/inputs/steps, cfg: /3/inputs/cfg}
defaults: {prompt: "2D game asset concept", negative_prompt: "text, watermark, blurry, photograph", seed: 20260831, width: 1024, height: 1024, steps: 25, cfg: 6.5}
models: [sdxl-base-1.0]
nodes: [CheckpointLoaderSimple, EmptyLatentImage, CLIPTextEncode, KSampler, VAEDecode, SaveImage]
resource_budget: {vram_gib: 10, ram_gib: 24, free_disk_gib: 8, timeout_seconds: 600}
export_lanes: [production]
